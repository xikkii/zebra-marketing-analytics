kind = "web"
previewPath = "/"
title = "zebra — Marketing Analytics"
version = "1.0.0"
id = "artifacts/zebra"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19335

[services.development]
run = "pnpm --filter @workspace/zebra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zebra", "run", "build" ]
serve = "static"
publicDir = "artifacts/zebra/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19335"
BASE_PATH = "/"
